<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="row">
  <div class="col">
    <div class="label today"><b>Today</b><span>Purple play button, frosted circles and a solid panel cover the video</span></div>
    <div class="screen"><img class="bg" src="../shot-player.png"></div>
  </div>

      <img class="bg" src="../mock-frame.png">

      <div class="abs tx" style="left:106px;top:18px;font-size:24px;font-weight:600">Northern Lights</div>
      <div class="abs tx" style="left:985px;top:18px;font-size:16px;font-weight:700;padding:3px 10px;border:1.5px solid rgba(255,255,255,.55);border-radius:20px">HW+</div>
